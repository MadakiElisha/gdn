# Simulated sensors (roadmap R2.4a): what tools/sim_sensors (gdn_sim_sensors) makes of
# Gazebo's error-free sensors in the GDN payload (sim/models/gdn_payload), so that each
# publishes what its real driver does: topic, message type, frame, units, rate, errors
# and timing.
#
# Per sensor:
#   kind           imu | range
#   raw_topic      the error-free Gazebo sensor, bridged by tools/sim_run.sh
#   topic, frame_id   as the real driver (docs/hardware/)
#   rate_hz        the sensor's own clock; IMU samples are interpolated onto it
#   tick_hz, skip_prob   (IMU) a sensor clock of tick_hz where each sample skips one tick
#                  with probability skip_prob (the OAK-D Lite's BMI270, TEST-025)
#   accel_in_g     (IMU) acceleration in g, as livox_ros_driver2 passes it through
#   model          (IMU) the R1.6 error model (config/imu/), applied by gdn::ImuErrorSim
#   stamp          sensor: the header carries the sample time (plus stamp_jitter_ms);
#                  arrival: the driver stamps it when it arrives (the H30WP's factory
#                  output has no sample time), i.e. the sample time plus the latency
#   latency_ms, latency_jitter_ms   from the sample to its arrival (normal, cut at 0)
#   stamp_jitter_ms   sigma of the error on a sensor stamp
#   drop_prob      probability that a message never arrives
#   seed           random seed (errors, timing)
# Range (TFmini-S): min_range, max_range (m), fov_deg, resolution (m), and the noise
#   sigma: noise_near_m below near_limit_m, noise_far_frac times the range beyond.
# Stereo (R2.4b, the OAK-D Lite's mono pair): per side (left_, right_) raw_topic, topic,
#   info_topic and frame_id; width, height (pixels), hfov_deg and baseline_m, which must
#   match the payload's two Gazebo cameras (tools/check_sim_sensors.py checks); rate_hz,
#   the cameras' update_rate there (the images aren't resampled: each carries the time
#   Gazebo rendered it); auto_exposure [target, tau_s, gain_min, gain_max]: Gazebo renders
#   linear light at 16 bits, and one gain for the pair brings its mean to target (0.18,
#   mid-grey) with time constant tau_s before the 8-bit sRGB encoding; noise_dn, read
#   noise sigma in grey levels, on the 8-bit image. One timing draw per pair: both
#   images get the same stamp and are lost together.
# Livox (R2.4c, the Mid-360S lidar): pattern, Livox's measured scan pattern (fetched by
#   tools/fetch_livox_pattern.sh) and pattern_mirror_az; grid_*, the payload's Gazebo
#   gpu_lidar rays (must match it: tools/check_sim_sensors.py checks); points_per_packet,
#   point_dt_us, packets_per_frame, frame_hz, the real stream's point clock; min_range,
#   max_range (no return beyond: published as 0, 0, 0), range_sigma_m, angle_sigma_deg;
#   reflectivity (Gazebo has none: one value for everything); lidar_id. The stamp is the
#   frame's first point; latency_ms counts from the frame's end.
#
# The cameras' latency, losses and read noise are placeholders too (R6.3 measures them).
# Measured: the IMU rates, the Mid-360S's stamp jitter and the OAK-D Lite's tick and
# skip pattern (TEST-024, TEST-025), the IMU error models (R1.6). Placeholders until
# Phase 6 measures them: every latency, the TFmini-S's dropouts and noise (from its
# datasheet: +-6 cm to 6 m, +-1% to 12 m, read as 2 sigma).
gdn_sim_sensors:
  ros__parameters:
    sensors: [h30wp, mid360s_imu, oakd_imu, tfmini, oakd_stereo, mid360s_lidar]

    h30wp:
      kind: imu
      raw_topic: /gdn/sim/raw/imu_h30wp
      topic: /imu/data
      frame_id: imu_link
      rate_hz: 200.0          # TEST-024: 200.004 Hz, even (it has its own clock)
      tick_hz: 0.0
      skip_prob: 0.0
      accel_in_g: false
      model: config/imu/h30wp.yaml
      stamp: arrival          # factory output has no sample time: tools/h30wp_node.py stamps on arrival
      latency_ms: 3.0         # placeholder: 460800 baud frame (about 1.5 ms) + USB polling
      latency_jitter_ms: 0.5  # placeholder
      stamp_jitter_ms: 0.0
      drop_prob: 0.0          # TEST-024: 0 lost of 1,620,010
      seed: 11

    mid360s_imu:
      kind: imu
      raw_topic: /gdn/sim/raw/imu_mid360s
      topic: /livox/imu
      frame_id: livox_frame   # tools/livox_run.sh frame_id
      rate_hz: 200.0          # TEST-025
      tick_hz: 0.0
      skip_prob: 0.0
      accel_in_g: true        # livox_ros_driver2 passes Livox's g through
      model: config/imu/mid360s.yaml
      stamp: sensor
      latency_ms: 1.0         # placeholder: Ethernet
      latency_jitter_ms: 0.2  # placeholder
      stamp_jitter_ms: 0.53   # TEST-025: spacing spread 15% of 5 ms = sqrt(2) x stamp sigma
      drop_prob: 0.0          # TEST-025: none lost
      seed: 12

    oakd_imu:
      kind: imu
      raw_topic: /gdn/sim/raw/imu_oakd
      topic: /oak/imu/data    # depthai_ros_driver_v3 (its IMU frame name to confirm in Phase 6)
      frame_id: oak_imu_frame
      rate_hz: 0.0            # set by the tick and the skips: about 239 Hz
      tick_hz: 394.5          # TEST-025: the BMI270's gyro ticks every 2.53 ms
      skip_prob: 0.65         # TEST-025: 65% of the steps skip one tick (60% of ticks come through)
      accel_in_g: false
      model: config/imu/oakd_lite.yaml
      stamp: sensor           # device time
      latency_ms: 4.0         # placeholder: USB
      latency_jitter_ms: 1.0  # placeholder
      stamp_jitter_ms: 0.0
      drop_prob: 0.0          # TEST-025: 0 lost reports
      seed: 13

    tfmini:
      kind: range
      raw_topic: /gdn/sim/raw/tfmini
      topic: /tfmini/range
      frame_id: tfmini_link
      rate_hz: 100.0          # datasheet default frame rate
      min_range: 0.1          # datasheet
      max_range: 12.0         # datasheet, 90% reflectivity (about 7 m on dark ground: not modelled)
      fov_deg: 2.0            # datasheet
      resolution: 0.01        # datasheet: 1 cm
      noise_near_m: 0.03      # datasheet +-6 cm (0.1 to 6 m) as 2 sigma
      near_limit_m: 6.0
      noise_far_frac: 0.005   # datasheet +-1% (6 to 12 m) as 2 sigma
      stamp: arrival          # UART, no sample time
      latency_ms: 5.0         # placeholder
      latency_jitter_ms: 1.0  # placeholder
      stamp_jitter_ms: 0.0
      drop_prob: 0.002        # placeholder
      seed: 14

    oakd_stereo:
      kind: stereo
      # depthai_ros_driver_v3 names (its URDF: <camera>_left_camera_optical_frame); the
      # simulated images are distortion-free, so raw is already rectified
      left_raw_topic: /gdn/sim/raw/oak_left
      left_topic: /oak/left/image_raw
      left_info_topic: /oak/left/camera_info
      left_frame_id: oak_left_camera_optical_frame
      right_raw_topic: /gdn/sim/raw/oak_right
      right_topic: /oak/right/image_raw
      right_info_topic: /oak/right/camera_info
      right_frame_id: oak_right_camera_optical_frame
      width: 640              # OV7251: 640 x 480, global shutter, mono
      height: 480
      hfov_deg: 73.0          # Luxonis: 73 x 58 degrees
      baseline_m: 0.075       # Luxonis; our unit's calibration says 7.50 cm (tools/oak_check.py)
      rate_hz: 30.0           # R6.2's VIO setup: 30 Hz or more (depthai-ros's vio.yaml runs 60)
      auto_exposure: [0.18, 0.2, 0.25, 16.0]   # placeholder: mid-grey, 0.2 s, gain 0.25 to 16
      noise_dn: 2.0           # placeholder: OV7251 read noise in good light, grey levels
      stamp: sensor           # device time, synced to the host (R6.3)
      latency_ms: 25.0        # placeholder: exposure, readout and USB to the driver
      latency_jitter_ms: 3.0  # placeholder
      stamp_jitter_ms: 0.0
      drop_prob: 0.002        # placeholder, per pair
      seed: 15

    mid360s_lidar:
      kind: livox
      # As livox_ros_driver2 1.2.8 publishes it with xfer_format 1 (CustomMsg); the numbers
      # marked "real" are from a 69 s recording of our unit (TEST-037).
      raw_topic: /gdn/sim/raw/mid360s_points
      topic: /livox/lidar
      frame_id: livox_frame   # tools/livox_run.sh, msg_MID360s_launch.py
      lidar_id: 192           # real
      pattern: data/livox/mid360.csv
      pattern_mirror_az: true # real: the unit sweeps the other way from the file's azimuth
      grid_h_samples: 720     # 0.5 deg, as the payload's gdn_mid360s_lidar
      grid_v_samples: 120     # 0.5 deg over -7.2 to 52.2 deg (the pattern's span)
      grid_h_min_deg: -180.0
      grid_h_max_deg: 179.5
      grid_v_min_deg: -7.2
      grid_v_max_deg: 52.2
      points_per_packet: 96   # real
      point_dt_us: 4.947      # real
      packets_per_frame: 208  # real: 19872 to 20160 points a frame, median 19968
      frame_hz: 10.0          # real (publish_freq 10)
      min_range: 0.1          # datasheet; real nearest 0.117 m
      max_range: 40.0         # datasheet: 40 m at 10% reflectivity (70 m at 80%)
      range_sigma_m: 0.02     # datasheet: 2 cm (1 sigma at 10 m)
      angle_sigma_deg: 0.15   # datasheet: < 0.15 deg
      reflectivity: 40        # placeholder: Gazebo has no reflectivity (real room median 55)
      stamp: sensor           # the first point's time (header.stamp = timebase)
      latency_ms: 5.0         # real: a recorder gets the frame 109 ms after its stamp (the frame
                              # is 100 ms); a 400 kB message takes about 4 ms to reach the bag
                              # (TEST-037: 113 ms with 9 here), so the driver's own part is 5
      latency_jitter_ms: 2.4  # real: sigma 2.4 ms (102 to 113 ms)
      stamp_jitter_ms: 0.0
      drop_prob: 0.0          # real: 0 of 693 frames
      seed: 16
