name: ci

# Runs on every push and pull request. Matches the setup in docs/SETUP.md:
# Ubuntu 24.04 + ROS 2 Jazzy, packages under src/ only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 60    # R1.9 added about 12 minutes (clang-tidy, sanitizers)
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git (needed for submodules)
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0    # R1.9: the format check compares a PR with its base branch

      - name: Dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake libeigen3-dev pkg-config \
            clang clang-tidy clang-format cppcheck \
            ros-jazzy-rosbag2-storage-mcap ros-jazzy-rclcpp-components \
            python3-numpy python3-scipy python3-matplotlib python3-h5py \
            python3-yaml python3-pil python3-rasterio
          rosdep update --rosdistro jazzy
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      # R1.9 code-quality gates (tools/quality.sh). First check each gate fails on a
      # planted defect, so a gate that can't fail doesn't pass silently.
      - name: Quality gates self-test (R1.9)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/quality.sh selftest

      - name: Unit tests, -O2 and -O3, warnings as errors (no ROS)
        run: tools/run_selftest.sh

      - name: Compiler warnings as errors, g++ and clang++ (R1.9)
        run: tools/quality.sh werror

      - name: Formatting of the lines this PR changes (R1.9)
        if: github.event_name == 'pull_request'
        run: tools/quality.sh format "origin/${{ github.base_ref }}"

      - name: Cache px4_msgs build
        uses: actions/cache@v4
        with:
          path: |
            build/px4_msgs
            install/px4_msgs
          key: px4msgs-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('src/px4_msgs/msg/*.msg') }}

      - name: colcon build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src --cmake-args -DCMAKE_BUILD_TYPE=Release \
            -DGDN_WERROR=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            --event-handlers console_cohesion+

      - name: colcon test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --base-paths src --packages-select gdn_fusion --event-handlers console_direct+
          colcon test-result --verbose

      # R1.9: bug-finding and performance checks; the ROS nodes use the compile flags
      # colcon exported above. clang-tidy takes about 5 minutes (the ROS headers).
      - name: Static analysis, cppcheck and clang-tidy (R1.9)
        run: |
          tools/quality.sh cppcheck
          tools/quality.sh tidy

      - name: Data checksums and map rebuild
        run: tools/make_data.sh --verify-maps

      # R1.11: the run log. The bench flies the Zermatt bag through eskf_node (at 2x), which
      # writes its run log; gdn_replay must reproduce every logged state, update and event
      # bit for bit, find a 1-ulp change in a copy of the log, and refuse the wrong map
      # (tools/log_check.sh, TEST-029). About 2 minutes.
      - name: Run log, record and replay (R1.11)
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tools/make_zermatt_bag.py
          tools/log_check.sh

      # R1.6: the Zermatt flights have an error-free IMU (imu_truth.csv), so their MC runs
      # apply the H30WP model (config/imu/h30wp.yaml, Allan fit of a 2 h bench log,
      # TEST-024) and say so; flight001 is a real log and keeps its recorded IMU.
      # --expect-imu fails a step whose label differs.
      - name: IMU model and Allan fit self-check (R1.6)
        run: python3 tools/allan_fit.py --selfcheck

      # R1.8: the requirements scorer reads its limits from docs/requirements.md; this
      # checks it still can, and that its rules (99% of flights, map condition) hold.
      - name: Requirements scorer self-check (R1.8)
        run: python3 tools/score_requirements.py --selfcheck

      - name: Monte Carlo, Zermatt, 24 seeds (ideal TRN, regression guard)
        run: |
          source env.sh
          tools/mc_run.sh 24 data/flight_zermatt_csv data/maps/zermatt.bin | tee mc.txt
          python3 tools/ci_check_mc.py mc.txt --expect-filter default --max-cep50 20 --min-passing 17 --expect-imu h30wp

      - name: Monte Carlo, Zermatt, 24 seeds (AGL model, R1.1)
        run: |
          source env.sh
          tools/mc_run.sh 24 data/flight_zermatt_csv data/maps/zermatt.bin --model=agl | tee mc_zermatt_agl.txt
          python3 tools/ci_check_mc.py mc_zermatt_agl.txt --expect-filter default --max-cep50 25 --min-passing 15 --expect-imu h30wp

      - name: Monte Carlo, Zermatt, 24 seeds (AGL model, node start-up path, R1.2)
        run: |
          source env.sh
          tools/mc_run.sh 24 data/flight_zermatt_csv data/maps/zermatt.bin --model=agl --startup=node | tee mc_zermatt_node.txt
          python3 tools/ci_check_mc.py mc_zermatt_node.txt --expect-filter default --max-cep50 15 --min-passing 19 --expect-imu h30wp

      # R1.5/R1.4: REQ-INT-001 (error > 3 x published sigma in at most 1% of samples)
      # on Zermatt, node start-up. Blocking since R1.4 (TEST-021: 0.00% on these 24
      # seeds, 0.46% on 100; it was about 14% before; TEST-024: 0.11% here, 0.60% on 100).
      - name: Consistency, Zermatt node start-up (REQ-INT-001)
        run: python3 tools/ci_check_mc.py mc_zermatt_node.txt --expect-filter default --max-over-3sigma 1 --max-nees-median 2.8

      # R1.3: onboard map differs from the truth world (REQ-DB-002). An SRTM-like map
      # (3x coarser, 6 m correlated noise, 3 m bias), 5 error patterns x 20 flights,
      # pooled. Regression guard around TEST-020 (25.6 m, 91/100).
      - name: Monte Carlo, Zermatt, degraded onboard maps (R1.3, 5 maps x 20 flights)
        run: |
          source env.sh
          python3 tools/mc_map_ensemble.py --world data/maps/zermatt.bin --csv data/flight_zermatt_csv \
            --recipe "--coarsen 3 --noise 6 --corr 200 --bias 3" --maps 5 --per-map 20 --tag ci_srtm \
            -- --model=agl --startup=node | tee mc_zermatt_dbmap.txt
          python3 tools/ci_check_mc.py mc_zermatt_dbmap.txt --expect-filter default --max-cep50 35 --min-passing 80 --expect-imu h30wp

      # R1.7: GNSS lost mid-flight with a covariance handover, scored from the loss over
      # 5 and 10 minutes (docs/requirements.md), on the 15 min Zermatt flight (make_data.sh).
      # REQ-INT-001 is blocking on the 5 minute window (TEST-024: 0.00% here and on 100
      # flights); the 10 minute figures are regression guards (TEST-024: CEP95 20.4 m and
      # 0.00% here, 22.5 m and 0.00% on 100; TEST-023 had 32 m and 0.93%).
      - name: Monte Carlo, Zermatt 15 min, GNSS lost at 150 s, 24 seeds (R1.7)
        run: |
          source env.sh
          tools/mc_run.sh 24 data/flight_zermatt_long_csv data/maps/zermatt.bin --model=agl --startup=node \
            --gnss-loss=150 | tee mc_zermatt_gnss_loss.txt
          python3 tools/ci_check_mc.py mc_zermatt_gnss_loss.txt --expect-filter default --expect-imu h30wp \
            --gnss-free-max-cep95 300=35 --gnss-free-max-over-3sigma 300=1 --gnss-free-min-never-over-100 300=22 \
            --gnss-free-max-cep95 600=45 --gnss-free-max-over-3sigma 600=3

      # R1.7: a 60 m start error, no GNSS (REQ-ACQ-001 counts flights under 100 m at 120 s
      # after take-off; TEST-023: 24/24 here, 99/100 on 100). 150 and 500 m fail until R4.1.
      - name: Monte Carlo, Zermatt, 60 m start error, 24 seeds (R1.7)
        run: |
          source env.sh
          tools/mc_run.sh 24 data/flight_zermatt_csv data/maps/zermatt.bin --model=agl --startup=node \
            --start-error=60 | tee mc_zermatt_start60.txt
          python3 tools/ci_check_mc.py mc_zermatt_start60.txt --expect-filter default --min-acquired 22 --max-over-3sigma 1 \
            --expect-imu h30wp

      - name: Fetch flight001 (release data-v1)
        run: tools/fetch_data.sh

      - name: Monte Carlo, flight001, 100 seeds (AGL model, 5 m baro drift)
        run: |
          source env.sh
          tools/mc_run.sh 100 data/flight001_csv data/maps/terrain_db_sigma4.bin --model=agl --baro-drift=5 | tee mc_flight001_agl.txt
          python3 tools/ci_check_mc.py mc_flight001_agl.txt --expect-filter default --max-cep50 32 --max-cep95 80 --min-passing 97 \
            --max-over-3sigma 1 --max-nees-median 2.8 --max-nis-over9 1 --expect-imu recorded

      # R1.7: GNSS lost at 150 s on the real recorded IMU. Regression guard only: this fails
      # REQ-INT-001 today, because the filter's accel noise setting is too small for this
      # IMU in flight (OI-013). TEST-024's tighter gyro-bias random walk made it more
      # accurate (CEP95 73 to 63 m at 5 min) but less honest (8.6% to 13.1% over 3 sigma
      # in the first 5 minutes, on 100 flights; 13.09% on these 24), hence 15 here.
      - name: Monte Carlo, flight001, GNSS lost at 150 s, 24 seeds (R1.7, guard)
        run: |
          source env.sh
          tools/mc_run.sh 24 data/flight001_csv data/maps/terrain_db_sigma4.bin --model=agl --baro-drift=5 \
            --gnss-loss=150 | tee mc_flight001_gnss_loss.txt
          python3 tools/ci_check_mc.py mc_flight001_gnss_loss.txt --expect-filter default --expect-imu recorded \
            --gnss-free-max-cep95 300=90 --gnss-free-max-over-3sigma 300=15 --gnss-free-max-cep95 600=95

      # R1.9: the selftest and short MC runs through each code path, built with
      # AddressSanitizer and UndefinedBehaviorSanitizer. About 5 minutes.
      - name: Sanitizers, ASan and UBSan (R1.9)
        run: tools/quality.sh sanitize

      - name: Keep MC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-report
          path: |
            mc*.txt
            /tmp/mc_per_seed.csv
          if-no-files-found: ignore
